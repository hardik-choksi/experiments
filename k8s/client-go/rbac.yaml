apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-getter
  namespace: loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-getter # Notice there is NO namespace key
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "configmaps", "namespaces"]
  verbs: ["get", "watch", "list"]
- apiGroups: ["apps"]
  resources:
    - daemonsets
    - deployments
    - deployments/scale
    - replicasets
    - replicasets/scale
    - statefulsets
    - controllerrevisions
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-getter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-getter
subjects:
  - kind: ServiceAccount
    name: data-getter
    namespace: loki

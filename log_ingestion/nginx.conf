http {
    upstream otel_collectors {
        # Round-robin distribution to your Gateway instances
        server otel-gateway-1:4317;
        server otel-gateway-2:4317;
    }

    server {
        listen 4317 http2; # gRPC requires HTTP/2

        location / {
            grpc_pass grpc://otel_collectors;
            
            # Crucial for gRPC stability
            grpc_read_timeout 60s;
            grpc_send_timeout 60s;
            grpc_socket_keepalive on;
        }
    }
}

dist:
  name: otelcol-custom
  description: Custom OTel Collector
  output_path: .
  otelcol_version: v0.143.0

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/mongodbreceiver v0.143.0
    path: /home/hardik/work/hardik/opentelemetry-collector-contrib/receiver/mongodbreceiver  # Use local path for your changes

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/otlpexporter v0.143.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.143.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/prometheusexporter v0.143.0
  # - gomod: go.opentelemetry.io/collector/exporter/nopexporter v0.139.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.143.0